schema_version: 1
id: financialdatasets-vs-edgar-latest-reported-financials
name: "Compare Financial Datasets REST against SEC EDGAR for latest reported quarterly financials"
flow:
  prompt: |
    You are running one variant of a financial-data extraction benchmark.

    Determine the ticker and data source from AXP_VARIANT_ID:
    - The ticker is the first segment before the first hyphen, uppercased.
    - Variants ending in `financialdatasets-rest` must use the Financial Datasets REST API.
    - Variants ending in `sec-edgar` must use SEC EDGAR/public SEC data directly.

    Task:
    Produce /workspace/answer.json for the assigned ticker's most recent
    company-reported quarterly earnings period. Report quarterly earnings
    data, not trailing twelve month values or an older quarter.

    Required output shape:
    {
      "ticker": "AAPL",
      "fiscal_year": 2025,
      "report_period": "YYYY-MM-DD",
      "source_kind": "financialdatasets-rest" | "sec-edgar",
      "source_urls": ["..."],
      "financials_usd": {
        "revenue": 383285000000,
        "net_income": 96995000000,
        "total_assets": 352583000000,
        "operating_cash_flow": 110543000000,
        "capital_expenditures": 10959000000,
        "free_cash_flow": 99584000000
      },
      "ratios": {
        "net_margin": 0.253062,
        "free_cash_flow_margin": 0.259817
      },
      "notes": ["short explanation of source and normalization choices"]
    }

    Financial Datasets REST variants:
    - Use FINANCIAL_DATASETS_API_KEY from the environment.
    - Authenticate with the X-API-KEY header.
    - Include api.financialdatasets.ai in source_urls.

    SEC EDGAR variants:
    - Do not use Financial Datasets, financialdatasets.ai, or the Financial
      Datasets docs/API in any way.
    - Use SEC EDGAR/public SEC data directly for the latest company-reported
      quarterly earnings period.
    - Send a respectful User-Agent if you make SEC HTTP requests.
    - Include sec.gov or data.sec.gov URLs in source_urls.

    For both sources:
    - Use USD values as full dollars, not millions.
    - Treat capital_expenditures as a positive cash outflow.
    - Compute free_cash_flow = operating_cash_flow - capital_expenditures.
    - Compute net_margin = net_income / revenue.
    - Compute free_cash_flow_margin = free_cash_flow / revenue.
    - Write only /workspace/answer.json. Do not include prose outside the file.
matrix:
  variant:
    - id: aapl-financialdatasets-rest
      tag: AAPL-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: aapl-sec-edgar
      tag: AAPL-sec-edgar
    - id: msft-financialdatasets-rest
      tag: MSFT-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: msft-sec-edgar
      tag: MSFT-sec-edgar
    - id: googl-financialdatasets-rest
      tag: GOOGL-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: googl-sec-edgar
      tag: GOOGL-sec-edgar
    - id: meta-financialdatasets-rest
      tag: META-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: meta-sec-edgar
      tag: META-sec-edgar
    - id: jnj-financialdatasets-rest
      tag: JNJ-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: jnj-sec-edgar
      tag: JNJ-sec-edgar
    - id: xom-financialdatasets-rest
      tag: XOM-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: xom-sec-edgar
      tag: XOM-sec-edgar
    - id: wmt-financialdatasets-rest
      tag: WMT-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: wmt-sec-edgar
      tag: WMT-sec-edgar
    - id: tsla-financialdatasets-rest
      tag: TSLA-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: tsla-sec-edgar
      tag: TSLA-sec-edgar
    - id: cost-financialdatasets-rest
      tag: COST-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: cost-sec-edgar
      tag: COST-sec-edgar
    - id: pg-financialdatasets-rest
      tag: PG-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: pg-sec-edgar
      tag: PG-sec-edgar
model: claude-sonnet-4-6
secrets: [FINANCIAL_DATASETS_API_KEY]
setup_checks:
  - name: runtime-tools-available
    script: |
      command -v python3 >/dev/null
      command -v jq >/dev/null
tests:
  application:
    - name: answer-exists
      script: |
        [ -s /workspace/answer.json ]
    - name: answer-valid-json
      script: |
        jq -e . /workspace/answer.json >/dev/null
    - name: answer-schema
      script: |
        jq -e '
          (.ticker | type == "string") and
          (.fiscal_year | type == "number") and
          (.report_period | type == "string") and
          (.source_kind | type == "string") and
          (.source_urls | type == "array" and length > 0 and all(type == "string")) and
          (.financials_usd | type == "object") and
          (.financials_usd.revenue | type == "number") and
          (.financials_usd.net_income | type == "number") and
          (.financials_usd.total_assets | type == "number") and
          (.financials_usd.operating_cash_flow | type == "number") and
          (.financials_usd.capital_expenditures | type == "number") and
          (.financials_usd.free_cash_flow | type == "number") and
          (.ratios.net_margin | type == "number") and
          (.ratios.free_cash_flow_margin | type == "number") and
          (.notes | type == "array")
        ' /workspace/answer.json >/dev/null
    - name: financial-values-match
      script: |
        python3 - <<'PY'
        import json
        import math
        import os
        import sys

        # Static source-truth fixture generated on 2026-05-15 with
        # scripts/inspect-latest-sec-financials.py and then hard-coded here.
        expected_by_ticker = {
            "aapl": {
                "ticker": "AAPL",
                "fiscal_year": 2026,
                "fiscal_period": "Q2",
                "report_period": "2026-03-28",
                "financials_usd": {
                    "revenue": 111184000000,
                    "net_income": 29578000000,
                    "total_assets": 371082000000,
                    "operating_cash_flow": 28702000000,
                    "capital_expenditures": 1971000000,
                    "free_cash_flow": 26731000000,
                },
            },
            "cost": {
                "ticker": "COST",
                "fiscal_year": 2026,
                "fiscal_period": "Q2",
                "report_period": "2026-02-15",
                "financials_usd": {
                    "revenue": 69597000000,
                    "net_income": 2035000000,
                    "total_assets": 83639000000,
                    "operating_cash_flow": 2996000000,
                    "capital_expenditures": 1289000000,
                    "free_cash_flow": 1707000000,
                },
            },
            "googl": {
                "ticker": "GOOGL",
                "fiscal_year": 2026,
                "fiscal_period": "Q1",
                "report_period": "2026-03-31",
                "financials_usd": {
                    "revenue": 109896000000,
                    "net_income": 62578000000,
                    "total_assets": 703919000000,
                    "operating_cash_flow": 45790000000,
                    "capital_expenditures": 35674000000,
                    "free_cash_flow": 10116000000,
                },
            },
            "jnj": {
                "ticker": "JNJ",
                "fiscal_year": 2026,
                "fiscal_period": "Q1",
                "report_period": "2026-03-29",
                "financials_usd": {
                    "revenue": 24062000000,
                    "net_income": 5235000000,
                    "total_assets": 200894000000,
                    "operating_cash_flow": 2514000000,
                    "capital_expenditures": 1049000000,
                    "free_cash_flow": 1465000000,
                },
            },
            "meta": {
                "ticker": "META",
                "fiscal_year": 2026,
                "fiscal_period": "Q1",
                "report_period": "2026-03-31",
                "financials_usd": {
                    "revenue": 56311000000,
                    "net_income": 26773000000,
                    "total_assets": 395250000000,
                    "operating_cash_flow": 32226000000,
                    "capital_expenditures": 18997000000,
                    "free_cash_flow": 13229000000,
                },
            },
            "msft": {
                "ticker": "MSFT",
                "fiscal_year": 2026,
                "fiscal_period": "Q3",
                "report_period": "2026-03-31",
                "financials_usd": {
                    "revenue": 82886000000,
                    "net_income": 31778000000,
                    "total_assets": 694228000000,
                    "operating_cash_flow": 46679000000,
                    "capital_expenditures": 30876000000,
                    "free_cash_flow": 15803000000,
                },
            },
            "pg": {
                "ticker": "PG",
                "fiscal_year": 2026,
                "fiscal_period": "Q3",
                "report_period": "2026-03-31",
                "financials_usd": {
                    "revenue": 21235000000,
                    "net_income": 3932000000,
                    "total_assets": 128378000000,
                    "operating_cash_flow": 4045000000,
                    "capital_expenditures": 1019000000,
                    "free_cash_flow": 3026000000,
                },
            },
            "tsla": {
                "ticker": "TSLA",
                "fiscal_year": 2026,
                "fiscal_period": "Q1",
                "report_period": "2026-03-31",
                "financials_usd": {
                    "revenue": 22387000000,
                    "net_income": 477000000,
                    "total_assets": 143724000000,
                    "operating_cash_flow": 3937000000,
                    "capital_expenditures": 2493000000,
                    "free_cash_flow": 1444000000,
                },
            },
            "wmt": {
                "ticker": "WMT",
                "fiscal_year": 2026,
                "fiscal_period": "Q4",
                "report_period": "2026-01-31",
                "financials_usd": {
                    "revenue": 190656000000,
                    "net_income": 4237000000,
                    "total_assets": 284668000000,
                    "operating_cash_flow": 14113000000,
                    "capital_expenditures": 8015000000,
                    "free_cash_flow": 6098000000,
                },
            },
            "xom": {
                "ticker": "XOM",
                "fiscal_year": 2026,
                "fiscal_period": "Q1",
                "report_period": "2026-03-31",
                "financials_usd": {
                    "revenue": 85138000000,
                    "net_income": 4183000000,
                    "total_assets": 464410000000,
                    "operating_cash_flow": 8705000000,
                    "capital_expenditures": 6470000000,
                    "free_cash_flow": 2235000000,
                },
            },
        }

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        variant_id = os.environ["AXP_VARIANT_ID"]
        ticker_key = variant_id.split("-", 1)[0]
        expected = expected_by_ticker[ticker_key]
        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        if got.get("ticker") != expected["ticker"]:
            fail(f"ticker mismatch: {got.get('ticker')} != {expected['ticker']}")
        if got.get("fiscal_year") != expected["fiscal_year"]:
            fail(f"fiscal_year mismatch: {got.get('fiscal_year')} != {expected['fiscal_year']}")
        if got.get("report_period") != expected["report_period"]:
            fail(f"report_period mismatch: {got.get('report_period')} != {expected['report_period']}")

        financials = got.get("financials_usd", {})
        for key in ["revenue", "net_income", "total_assets", "operating_cash_flow", "capital_expenditures", "free_cash_flow"]:
            actual = financials.get(key)
            target = expected["financials_usd"][key]
            tolerance = max(abs(target) * 0.002, 5_000_000)
            if actual is None or abs(actual - target) > tolerance:
                fail(f"{key} mismatch: {actual} not within {tolerance} of {target}")

        computed_fcf = financials["operating_cash_flow"] - financials["capital_expenditures"]
        if abs(financials["free_cash_flow"] - computed_fcf) > 1:
            fail("free_cash_flow does not equal operating_cash_flow - capital_expenditures")

        ratios = got.get("ratios", {})
        computed_net_margin = financials["net_income"] / financials["revenue"]
        computed_fcf_margin = financials["free_cash_flow"] / financials["revenue"]
        if not math.isclose(ratios.get("net_margin"), computed_net_margin, abs_tol=0.002):
            fail("net_margin is not computed from submitted values")
        if not math.isclose(ratios.get("free_cash_flow_margin"), computed_fcf_margin, abs_tol=0.002):
            fail("free_cash_flow_margin is not computed from submitted values")
        PY
    - name: source-kind-match
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys

        variant_id = os.environ["AXP_VARIANT_ID"]
        expected_source = "financialdatasets-rest" if variant_id.endswith("-financialdatasets-rest") else "sec-edgar"
        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        if got.get("source_kind") != expected_source:
            fail(f"source_kind mismatch: {got.get('source_kind')} != {expected_source}")
        PY
  introspection:
    - name: source-requests-match-variant
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys

        variant_id = os.environ["AXP_VARIANT_ID"]
        expected_source = "financialdatasets-rest" if variant_id.endswith("-financialdatasets-rest") else "sec-edgar"
        trace_path = os.environ["AXP_TRACE_PATH"]

        request_texts = []
        with open(trace_path, "r", encoding="utf-8") as f:
            for line in f:
                event = json.loads(line)
                raw = event.get("raw_json", {})
                update = raw.get("params", {}).get("update", {})
                meta = update.get("_meta", {}).get("claudeCode", {})
                tool_name = meta.get("toolName")
                if tool_name not in {"Bash", "WebFetch"}:
                    continue
                raw_input = update.get("rawInput") or {}
                request_texts.extend(
                    str(raw_input.get(key, ""))
                    for key in ("command", "url", "description", "prompt")
                )
                request_texts.append(str(update.get("title", "")))

        request_text = "\n".join(request_texts).lower()

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        if expected_source == "financialdatasets-rest":
            if "api.financialdatasets.ai" not in request_text:
                fail("Financial Datasets variant did not request api.financialdatasets.ai")
            if "sec.gov" in request_text or "data.sec.gov" in request_text:
                fail("Financial Datasets variant used SEC EDGAR")
        else:
            if "financialdatasets.ai" in request_text:
                fail("SEC EDGAR variant used Financial Datasets")
            if "sec.gov" not in request_text and "data.sec.gov" not in request_text:
                fail("SEC EDGAR variant did not request SEC URLs")
        PY
limits:
  max_turns: 70
  max_time_seconds: 1200
  max_cost_usd: 2.00
