schema_version: 1
id: financialdatasets-vs-edgar-normalized-financials
name: "Compare Financial Datasets REST against SEC EDGAR for normalized financials"
flow:
  prompt: |
    You are running one variant of a financial-data extraction benchmark.

    Determine the ticker and data source from AXP_VARIANT_ID:
    - The ticker is the first segment before the first hyphen, uppercased.
    - Variants ending in `financialdatasets-rest` must use the Financial Datasets REST API.
    - Variants ending in `sec-edgar` must use SEC EDGAR/public SEC data directly.

    Task:
    Produce /workspace/answer.json for the assigned ticker's FY2023 annual
    financials. Use the annual report period for FY2023, not trailing twelve
    months and not FY2024.

    Required output shape:
    {
      "ticker": "AAPL",
      "fiscal_year": 2023,
      "report_period": "YYYY-MM-DD",
      "source_kind": "financialdatasets-rest" | "sec-edgar",
      "source_urls": ["..."],
      "financials_usd": {
        "revenue": 383285000000,
        "net_income": 96995000000,
        "total_assets": 352583000000,
        "operating_cash_flow": 110543000000,
        "capital_expenditures": 10959000000,
        "free_cash_flow": 99584000000
      },
      "ratios": {
        "net_margin": 0.253062,
        "free_cash_flow_margin": 0.259817
      },
      "notes": ["short explanation of source and normalization choices"]
    }

    Financial Datasets REST variants:
    - Use FINANCIAL_DATASETS_API_KEY from the environment.
    - Authenticate with the X-API-KEY header.
    - Prefer https://api.financialdatasets.ai/financials/?ticker=<TICKER>&period=annual&limit=1
      or the smallest equivalent number of Financial Datasets requests.
    - Include api.financialdatasets.ai in source_urls.

    SEC EDGAR variants:
    - Do not use Financial Datasets, financialdatasets.ai, or the Financial
      Datasets docs/API in any way.
    - Use SEC EDGAR/public SEC data directly, such as companyfacts XBRL JSON
      and filing metadata from sec.gov/data.sec.gov.
    - Send a respectful User-Agent if you make SEC HTTP requests.
    - Include sec.gov or data.sec.gov URLs in source_urls.

    For both sources:
    - Use USD values as full dollars, not millions.
    - Treat capital_expenditures as a positive cash outflow.
    - Compute free_cash_flow = operating_cash_flow - capital_expenditures.
    - Compute net_margin = net_income / revenue.
    - Compute free_cash_flow_margin = free_cash_flow / revenue.
    - Write only /workspace/answer.json. Do not include prose outside the file.
matrix:
  variant:
    - id: aapl-financialdatasets-rest
      tag: AAPL-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: aapl-sec-edgar
      tag: AAPL-sec-edgar
    - id: msft-financialdatasets-rest
      tag: MSFT-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: msft-sec-edgar
      tag: MSFT-sec-edgar
    - id: googl-financialdatasets-rest
      tag: GOOGL-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: googl-sec-edgar
      tag: GOOGL-sec-edgar
    - id: meta-financialdatasets-rest
      tag: META-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: meta-sec-edgar
      tag: META-sec-edgar
    - id: jnj-financialdatasets-rest
      tag: JNJ-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: jnj-sec-edgar
      tag: JNJ-sec-edgar
    - id: xom-financialdatasets-rest
      tag: XOM-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: xom-sec-edgar
      tag: XOM-sec-edgar
    - id: wmt-financialdatasets-rest
      tag: WMT-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: wmt-sec-edgar
      tag: WMT-sec-edgar
    - id: tsla-financialdatasets-rest
      tag: TSLA-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: tsla-sec-edgar
      tag: TSLA-sec-edgar
    - id: cost-financialdatasets-rest
      tag: COST-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: cost-sec-edgar
      tag: COST-sec-edgar
    - id: pg-financialdatasets-rest
      tag: PG-financialdatasets-rest
      overrides:
        secrets: [FINANCIAL_DATASETS_API_KEY]
    - id: pg-sec-edgar
      tag: PG-sec-edgar
model: claude-sonnet-4-6
tests:
  application:
    - name: answer-exists
      script: |
        [ -s /workspace/answer.json ]
    - name: answer-valid-json
      script: |
        jq -e . /workspace/answer.json >/dev/null
    - name: answer-schema
      script: |
        jq -e '
          (.ticker | type == "string") and
          (.fiscal_year | type == "number") and
          (.report_period | type == "string") and
          (.source_kind | type == "string") and
          (.source_urls | type == "array" and length > 0 and all(type == "string")) and
          (.financials_usd | type == "object") and
          (.financials_usd.revenue | type == "number") and
          (.financials_usd.net_income | type == "number") and
          (.financials_usd.total_assets | type == "number") and
          (.financials_usd.operating_cash_flow | type == "number") and
          (.financials_usd.capital_expenditures | type == "number") and
          (.financials_usd.free_cash_flow | type == "number") and
          (.ratios.net_margin | type == "number") and
          (.ratios.free_cash_flow_margin | type == "number") and
          (.notes | type == "array")
        ' /workspace/answer.json >/dev/null
    - name: financial-values-match
      script: |
        python3 - <<'PY'
        import json
        import math
        import os
        import sys
        import urllib.request

        metadata = {
            "aapl": {"ticker": "AAPL", "cik": "0000320193", "fiscal_year": 2023, "report_period": "2023-09-30"},
            "msft": {"ticker": "MSFT", "cik": "0000789019", "fiscal_year": 2023, "report_period": "2023-06-30"},
            "googl": {"ticker": "GOOGL", "cik": "0001652044", "fiscal_year": 2023, "report_period": "2023-12-31"},
            "meta": {"ticker": "META", "cik": "0001326801", "fiscal_year": 2023, "report_period": "2023-12-31"},
            "jnj": {"ticker": "JNJ", "cik": "0000200406", "fiscal_year": 2023, "report_period": "2023-12-31"},
            "xom": {"ticker": "XOM", "cik": "0000034088", "fiscal_year": 2023, "report_period": "2023-12-31"},
            "wmt": {"ticker": "WMT", "cik": "0000104169", "fiscal_year": 2023, "report_period": "2023-01-31"},
            "tsla": {"ticker": "TSLA", "cik": "0001318605", "fiscal_year": 2023, "report_period": "2023-12-31"},
            "cost": {"ticker": "COST", "cik": "0000909832", "fiscal_year": 2023, "report_period": "2023-09-03"},
            "pg": {"ticker": "PG", "cik": "0000080424", "fiscal_year": 2023, "report_period": "2023-06-30"},
        }

        tag_candidates = {
            "revenue": [
                "RevenueFromContractWithCustomerExcludingAssessedTax",
                "Revenues",
                "SalesRevenueNet",
            ],
            "net_income": ["NetIncomeLoss"],
            "total_assets": ["Assets"],
            "operating_cash_flow": ["NetCashProvidedByUsedInOperatingActivities"],
            "capital_expenditures": ["PaymentsToAcquirePropertyPlantAndEquipment"],
        }

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        def load_companyfacts(cik):
            req = urllib.request.Request(
                f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json",
                headers={"User-Agent": "AXP eval validation contact@example.com"},
            )
            with urllib.request.urlopen(req, timeout=30) as resp:
                return json.load(resp)

        def fact_value(companyfacts, tags, report_period):
            facts = companyfacts.get("facts", {}).get("us-gaap", {})
            matches = []
            for tag in tags:
                units = facts.get(tag, {}).get("units", {}).get("USD", [])
                for row in units:
                    if row.get("end") != report_period:
                        continue
                    if row.get("form") not in {"10-K", "10-K/A"}:
                        continue
                    matches.append((row.get("filed", ""), row.get("fy", 0), tag, row.get("val")))
            if not matches:
                fail(f"missing SEC fact for {tags} @ {report_period}")
            matches.sort(reverse=True)
            return matches[0][3]

        variant_id = os.environ["AXP_VARIANT_ID"]
        ticker_key = variant_id.split("-", 1)[0]
        meta = metadata[ticker_key]
        companyfacts = load_companyfacts(meta["cik"])
        expected = {
            "ticker": meta["ticker"],
            "fiscal_year": meta["fiscal_year"],
            "report_period": meta["report_period"],
            "revenue": fact_value(companyfacts, tag_candidates["revenue"], meta["report_period"]),
            "net_income": fact_value(companyfacts, tag_candidates["net_income"], meta["report_period"]),
            "total_assets": fact_value(companyfacts, tag_candidates["total_assets"], meta["report_period"]),
            "operating_cash_flow": fact_value(companyfacts, tag_candidates["operating_cash_flow"], meta["report_period"]),
            "capital_expenditures": fact_value(companyfacts, tag_candidates["capital_expenditures"], meta["report_period"]),
        }
        expected["free_cash_flow"] = expected["operating_cash_flow"] - expected["capital_expenditures"]
        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        if got.get("ticker") != expected["ticker"]:
            fail(f"ticker mismatch: {got.get('ticker')} != {expected['ticker']}")
        if got.get("fiscal_year") != expected["fiscal_year"]:
            fail(f"fiscal_year mismatch: {got.get('fiscal_year')} != {expected['fiscal_year']}")
        if got.get("report_period") != expected["report_period"]:
            fail(f"report_period mismatch: {got.get('report_period')} != {expected['report_period']}")

        financials = got.get("financials_usd", {})
        for key in ["revenue", "net_income", "total_assets", "operating_cash_flow", "capital_expenditures", "free_cash_flow"]:
            actual = financials.get(key)
            target = expected[key]
            tolerance = max(abs(target) * 0.002, 5_000_000)
            if actual is None or abs(actual - target) > tolerance:
                fail(f"{key} mismatch: {actual} not within {tolerance} of {target}")

        computed_fcf = financials["operating_cash_flow"] - financials["capital_expenditures"]
        if abs(financials["free_cash_flow"] - computed_fcf) > 1:
            fail("free_cash_flow does not equal operating_cash_flow - capital_expenditures")

        ratios = got.get("ratios", {})
        computed_net_margin = financials["net_income"] / financials["revenue"]
        computed_fcf_margin = financials["free_cash_flow"] / financials["revenue"]
        if not math.isclose(ratios.get("net_margin"), computed_net_margin, abs_tol=0.002):
            fail("net_margin is not computed from submitted values")
        if not math.isclose(ratios.get("free_cash_flow_margin"), computed_fcf_margin, abs_tol=0.002):
            fail("free_cash_flow_margin is not computed from submitted values")
        PY
    - name: source-match
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys

        variant_id = os.environ["AXP_VARIANT_ID"]
        expected_source = "financialdatasets-rest" if variant_id.endswith("-financialdatasets-rest") else "sec-edgar"
        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        if got.get("source_kind") != expected_source:
            fail(f"source_kind mismatch: {got.get('source_kind')} != {expected_source}")

        urls = " ".join(got.get("source_urls", [])).lower()
        if expected_source == "financialdatasets-rest":
            if "api.financialdatasets.ai" not in urls:
                fail("Financial Datasets variant must include api.financialdatasets.ai in source_urls")
        else:
            if "financialdatasets.ai" in urls:
                fail("SEC EDGAR variant must not include Financial Datasets URLs")
            if "sec.gov" not in urls and "data.sec.gov" not in urls:
                fail("SEC EDGAR variant must include sec.gov or data.sec.gov in source_urls")
        PY
  introspection: []
limits:
  max_turns: 70
  max_time_seconds: 1200
  max_cost_usd: 2.00
