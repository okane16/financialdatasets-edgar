setup_checks:
  - name: runtime-tools-available
    script: |
      command -v python3 >/dev/null
      command -v jq >/dev/null
  - name: staged-fixtures-present
    script: |
      set -e
      test -f /opt/axp-eval/fixtures/latest-reporting-period-core.json
      test -f /opt/axp-eval/scripts/eval_bootstrap.py
      mkdir -p /workspace/fixtures /workspace/scripts
      cp -a /opt/axp-eval/fixtures/. /workspace/fixtures/
      cp -a /opt/axp-eval/scripts/. /workspace/scripts/
  - name: eval-fixtures-available
    script: |
      python3 - <<'PY'
      import sys
      from pathlib import Path

      def fail(message):
          print(message, file=sys.stderr)
          sys.exit(1)

      def bootstrap_scripts():
          for parent in [Path.cwd(), *Path.cwd().parents]:
              scripts = parent / "scripts"
              if (scripts / "eval_bootstrap.py").is_file():
                  if str(scripts) not in sys.path:
                      sys.path.insert(0, str(scripts))
                  return
          fail("scripts/eval_bootstrap.py not found")

      bootstrap_scripts()
      from eval_bootstrap import load_core_fixture
      from fixture_paths import resolve_tickers_path

      load_core_fixture()
      resolve_tickers_path()
      PY
tests:
  application:
    - name: answer-exists
      script: |
        [ -s /workspace/answer.json ]
    - name: answer-valid-json
      script: |
        jq -e . /workspace/answer.json >/dev/null
    - name: answer-schema
      script: |
        jq -e '
          def number_or_null: (. == null) or (type == "number");
          (.ticker | type == "string") and
          (.fiscal_year | type == "number") and
          (.fiscal_period | type == "string") and
          (.report_type | type == "string") and
          (.report_period | type == "string") and
          (.source_kind | type == "string") and
          (.income_statement | type == "object") and
          (.income_statement.revenue | type == "number") and
          (.income_statement.gross_profit | number_or_null) and
          (.income_statement.operating_income | number_or_null) and
          (.income_statement.net_income | type == "number") and
          (.income_statement.diluted_eps | number_or_null) and
          (.income_statement.weighted_average_diluted_shares | number_or_null) and
          (.balance_sheet | type == "object") and
          (.balance_sheet.cash_and_equivalents | number_or_null) and
          (.balance_sheet.total_debt | number_or_null) and
          (.balance_sheet.net_cash_or_debt | number_or_null) and
          (.balance_sheet.total_assets | type == "number") and
          (.balance_sheet.total_liabilities | number_or_null) and
          (.balance_sheet.shareholders_equity | number_or_null) and
          (.balance_sheet.current_assets | number_or_null) and
          (.balance_sheet.current_liabilities | number_or_null) and
          (.cash_flow | type == "object") and
          (.cash_flow.operating_cash_flow | type == "number") and
          (.cash_flow.capital_expenditures | type == "number") and
          (.cash_flow.free_cash_flow | type == "number") and
          (.cash_flow.depreciation_and_amortization | number_or_null) and
          (.cash_flow.stock_based_compensation | number_or_null) and
          (.cash_flow.dividends_paid | number_or_null) and
          (.cash_flow.share_repurchases | number_or_null) and
          (.metrics | type == "object") and
          (.metrics.gross_margin | number_or_null) and
          (.metrics.operating_margin | number_or_null) and
          (.metrics.net_margin | type == "number") and
          (.metrics.free_cash_flow_margin | type == "number") and
          (.metrics.free_cash_flow_conversion | number_or_null) and
          (.metrics.capex_intensity | type == "number") and
          (.metrics.current_ratio | number_or_null) and
          (.metrics.debt_to_equity | number_or_null) and
          (.missing_fields | type == "array" and all(type == "string")) and
          (.notes | type == "array")
        ' /workspace/answer.json >/dev/null
    - name: period-match
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys
        from pathlib import Path

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        def bootstrap_scripts():
            for parent in [Path.cwd(), *Path.cwd().parents]:
                scripts = parent / "scripts"
                if (scripts / "eval_bootstrap.py").is_file():
                    if str(scripts) not in sys.path:
                        sys.path.insert(0, str(scripts))
                    return
            fail("scripts/eval_bootstrap.py not found")

        bootstrap_scripts()
        from eval_bootstrap import expected_symbol, load_core_fixture

        variant_id = os.environ["AXP_VARIANT_ID"]
        ticker_key = variant_id.split("-", 1)[0]
        expected = load_core_fixture()["expected_by_ticker"][ticker_key]
        period = expected["period"]
        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        if got.get("ticker") != expected_symbol(ticker_key):
            fail(f"ticker mismatch: {got.get('ticker')} != {expected_symbol(ticker_key)}")
        if got.get("fiscal_year") != period["fiscal_year"]:
            fail(f"fiscal_year mismatch: {got.get('fiscal_year')} != {period['fiscal_year']}")
        if got.get("fiscal_period") != period["fiscal_period"]:
            fail(f"fiscal_period mismatch: {got.get('fiscal_period')} != {period['fiscal_period']}")
        if got.get("report_period") != period["report_period"]:
            fail(f"report_period mismatch: {got.get('report_period')} != {period['report_period']}")
        PY
    - name: core-financial-values-score
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys
        from pathlib import Path

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        def bootstrap_scripts():
            for parent in [Path.cwd(), *Path.cwd().parents]:
                scripts = parent / "scripts"
                if (scripts / "eval_bootstrap.py").is_file():
                    if str(scripts) not in sys.path:
                        sys.path.insert(0, str(scripts))
                    return
            fail("scripts/eval_bootstrap.py not found")

        bootstrap_scripts()
        from eval_bootstrap import load_core_fixture

        variant_id = os.environ["AXP_VARIANT_ID"]
        ticker_key = variant_id.split("-", 1)[0]
        fixture = load_core_fixture()
        expected = fixture["expected_by_ticker"][ticker_key]
        grading = fixture.get("grading", {})
        min_correct = grading.get("min_correct", 5)
        relative_tolerance = grading.get("relative_tolerance", 0.002)
        absolute_tolerance_usd = grading.get("absolute_tolerance_usd", 5_000_000)

        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        failures = []
        total = 0
        for section, metrics in expected["core_values"].items():
            for key, target in metrics.items():
                total += 1
                actual = got.get(section, {}).get(key)
                tolerance = max(abs(target) * relative_tolerance, absolute_tolerance_usd)
                field_path = f"{section}.{key}"
                if actual is None or abs(actual - target) > tolerance:
                    failures.append(
                        f"{field_path} mismatch: {actual} not within {tolerance} of {target}"
                    )
        correct = total - len(failures)
        if correct < min_correct:
            fail(f"core financial values correct {correct}/{total}; " + "; ".join(failures))
        if failures:
            print(
                f"core financial values correct {correct}/{total}; "
                f"tolerated mismatches: " + "; ".join(failures)
            )
        PY
    - name: missing-fields-consistent
      script: |
        python3 - <<'PY'
        import json
        import sys

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        missing_fields = set(got.get("missing_fields", []))
        sections = {
            "income_statement": got.get("income_statement", {}),
            "balance_sheet": got.get("balance_sheet", {}),
            "cash_flow": got.get("cash_flow", {}),
            "metrics": got.get("metrics", {}),
        }
        for section_name, section in sections.items():
            for key, value in section.items():
                field_path = f"{section_name}.{key}"
                if value is None and field_path not in missing_fields:
                    fail(f"{field_path} is null but missing from missing_fields")
                if value is not None and field_path in missing_fields:
                    fail(f"{field_path} has a value but is listed in missing_fields")
        PY
    - name: derived-math-consistent
      script: |
        python3 - <<'PY'
        import json
        import math
        import sys

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        income_statement = got.get("income_statement", {})
        balance_sheet = got.get("balance_sheet", {})
        cash_flow = got.get("cash_flow", {})
        metrics = got.get("metrics", {})

        computed_fcf = cash_flow["operating_cash_flow"] - cash_flow["capital_expenditures"]
        if abs(cash_flow["free_cash_flow"] - computed_fcf) > 1:
            fail("free_cash_flow does not equal operating_cash_flow - capital_expenditures")

        if (
            balance_sheet.get("cash_and_equivalents") is not None
            and balance_sheet.get("total_debt") is not None
            and balance_sheet.get("net_cash_or_debt") is not None
        ):
            computed_net_cash = balance_sheet["cash_and_equivalents"] - balance_sheet["total_debt"]
            if abs(balance_sheet["net_cash_or_debt"] - computed_net_cash) > 1:
                fail("net_cash_or_debt does not equal cash_and_equivalents - total_debt")

        revenue = income_statement["revenue"]
        net_income = income_statement["net_income"]
        computed_net_margin = net_income / revenue
        computed_fcf_margin = cash_flow["free_cash_flow"] / revenue
        computed_capex_intensity = cash_flow["capital_expenditures"] / revenue
        if not math.isclose(metrics.get("net_margin"), computed_net_margin, abs_tol=0.002):
            fail("net_margin is not computed from submitted values")
        if not math.isclose(metrics.get("free_cash_flow_margin"), computed_fcf_margin, abs_tol=0.002):
            fail("free_cash_flow_margin is not computed from submitted values")
        if not math.isclose(metrics.get("capex_intensity"), computed_capex_intensity, abs_tol=0.002):
            fail("capex_intensity is not computed from submitted values")
        if net_income != 0 and metrics.get("free_cash_flow_conversion") is not None:
            computed_fcf_conversion = cash_flow["free_cash_flow"] / net_income
            if not math.isclose(metrics.get("free_cash_flow_conversion"), computed_fcf_conversion, abs_tol=0.002):
                fail("free_cash_flow_conversion is not computed from submitted values")
        if income_statement.get("gross_profit") is not None and metrics.get("gross_margin") is not None:
            computed_gross_margin = income_statement["gross_profit"] / revenue
            if not math.isclose(metrics.get("gross_margin"), computed_gross_margin, abs_tol=0.002):
                fail("gross_margin is not computed from submitted values")
        if income_statement.get("operating_income") is not None and metrics.get("operating_margin") is not None:
            computed_operating_margin = income_statement["operating_income"] / revenue
            if not math.isclose(metrics.get("operating_margin"), computed_operating_margin, abs_tol=0.002):
                fail("operating_margin is not computed from submitted values")
        if (
            balance_sheet.get("current_assets") is not None
            and balance_sheet.get("current_liabilities") not in {None, 0}
            and metrics.get("current_ratio") is not None
        ):
            computed_current_ratio = balance_sheet["current_assets"] / balance_sheet["current_liabilities"]
            if not math.isclose(metrics.get("current_ratio"), computed_current_ratio, abs_tol=0.002):
                fail("current_ratio is not computed from submitted values")
        if (
            balance_sheet.get("total_debt") is not None
            and balance_sheet.get("shareholders_equity") not in {None, 0}
            and metrics.get("debt_to_equity") is not None
        ):
            computed_debt_to_equity = balance_sheet["total_debt"] / balance_sheet["shareholders_equity"]
            if not math.isclose(metrics.get("debt_to_equity"), computed_debt_to_equity, abs_tol=0.002):
                fail("debt_to_equity is not computed from submitted values")
        PY
    - name: source-kind-match
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys

        variant_id = os.environ["AXP_VARIANT_ID"]
        expected_source = "financialdatasets-rest" if variant_id.endswith("-financialdatasets-rest") else "sec-edgar"
        with open("/workspace/answer.json", "r", encoding="utf-8") as f:
            got = json.load(f)

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        if got.get("source_kind") != expected_source:
            fail(f"source_kind mismatch: {got.get('source_kind')} != {expected_source}")
        PY
  introspection:
    - name: source-requests-match-variant
      script: |
        python3 - <<'PY'
        import json
        import os
        import sys

        variant_id = os.environ["AXP_VARIANT_ID"]
        expected_source = "financialdatasets-rest" if variant_id.endswith("-financialdatasets-rest") else "sec-edgar"
        trace_path = os.environ["AXP_TRACE_PATH"]

        request_texts = []
        with open(trace_path, "r", encoding="utf-8") as f:
            for line in f:
                event = json.loads(line)
                raw = event.get("raw_json", {})
                update = raw.get("params", {}).get("update", {})
                meta = update.get("_meta", {}).get("claudeCode", {})
                tool_name = meta.get("toolName")
                if tool_name not in {"Bash", "WebFetch"}:
                    continue
                raw_input = update.get("rawInput") or {}
                request_texts.extend(
                    str(raw_input.get(key, ""))
                    for key in ("command", "url", "description", "prompt")
                )
                request_texts.append(str(update.get("title", "")))

        request_text = "\n".join(request_texts).lower()

        def fail(message):
            print(message, file=sys.stderr)
            sys.exit(1)

        if expected_source == "financialdatasets-rest":
            if "api.financialdatasets.ai" not in request_text:
                fail("Financial Datasets variant did not request api.financialdatasets.ai")
            if "sec.gov" in request_text or "data.sec.gov" in request_text:
                fail("Financial Datasets variant used SEC EDGAR")
        else:
            if "financialdatasets.ai" in request_text:
                fail("SEC EDGAR variant used Financial Datasets")
            if "sec.gov" not in request_text and "data.sec.gov" not in request_text:
                fail("SEC EDGAR variant did not request SEC URLs")
        PY
limits:
  max_turns: 70
  max_time_seconds: 1200
  max_cost_usd: 2.00
