# Staging setup is generated — run: python3 scripts/sync-experiment-fixture-setup.py
schema_version: 1
id: financialdatasets-vs-edgar-latest-reported-financials
name: "Compare Financial Datasets REST against SEC EDGAR for latest reporting period financial snapshots"
flow:
  prompt: |
    You are running one variant of a financial-data extraction benchmark.

    Determine the ticker and data source from AXP_VARIANT_ID:
    - The ticker is the first segment before the first hyphen, uppercased.
    - Variants ending in `financialdatasets-rest` must use the Financial Datasets REST API.
    - Variants ending in `sec-edgar` must use SEC EDGAR/public SEC data directly.

    Task:
    Produce /workspace/answer.json containing a financial snapshot for the
    assigned ticker's latest company-reported fiscal period.

    Latest reporting period means the newest fiscal period the company has
    reported, regardless of whether it appears in an interim filing/record or
    an annual filing/record. For Q1, Q2, or Q3 this is usually an interim
    period. For Q4/year-end this may be an annual period. Do not skip a newer
    Q4/year-end period in favor of an older interim quarter, and do not use
    trailing twelve month values.

    Required output shape:
    {
      "ticker": "AAPL",
      "fiscal_year": 2025,
      "fiscal_period": "Q1" | "Q2" | "Q3" | "Q4",
      "report_type": "quarterly" | "annual",
      "report_period": "YYYY-MM-DD",
      "source_kind": "financialdatasets-rest" | "sec-edgar",
      "income_statement": {
        "revenue": 383285000000,
        "gross_profit": 169148000000,
        "operating_income": 123216000000,
        "net_income": 96995000000,
        "diluted_eps": 6.08,
        "weighted_average_diluted_shares": 15955000000
      },
      "balance_sheet": {
        "cash_and_equivalents": 29943000000,
        "total_debt": 106629000000,
        "net_cash_or_debt": -76686000000,
        "total_assets": 352583000000,
        "total_liabilities": 290437000000,
        "shareholders_equity": 62146000000,
        "current_assets": 143566000000,
        "current_liabilities": 133973000000
      },
      "cash_flow": {
        "operating_cash_flow": 110543000000,
        "capital_expenditures": 10959000000,
        "free_cash_flow": 99584000000,
        "depreciation_and_amortization": 11445000000,
        "stock_based_compensation": 11688000000,
        "dividends_paid": 15234000000,
        "share_repurchases": 94949000000
      },
      "metrics": {
        "gross_margin": 0.4413,
        "operating_margin": 0.3215,
        "net_margin": 0.253062,
        "free_cash_flow_margin": 0.259817,
        "free_cash_flow_conversion": 1.0267,
        "capex_intensity": 0.0286,
        "current_ratio": 1.0716,
        "debt_to_equity": 1.7158
      },
      "missing_fields": [],
      "notes": ["short explanation of source and normalization choices"]
    }

    Source constraint:
    - If AXP_VARIANT_ID ends in `financialdatasets-rest`, use only the Financial
      Datasets API as the source of record.
    - If AXP_VARIANT_ID ends in `sec-edgar`, use only SEC EDGAR/public SEC data
      as the source of record.
    - Do not use the other source for this variant.

    Reporting rules:
    - Report metrics as a common shareholder would see on consolidated quarterly
      financials on Yahoo Finance / MarketWatch.
    - Use one consistent report_period across all fields.
    - Use USD values as full dollars, not millions.
    - Use current-period values for income-statement and cash-flow fields.
    - Use period-end values for balance-sheet fields.
    - If a source reports cash-flow values cumulatively for the fiscal year to
      date, derive the current-quarter operating_cash_flow and
      capital_expenditures from the prior period when needed, and explain that
      normalization in notes.
    - Treat capital_expenditures as a positive cash outflow.
    - If a required snapshot field is not reported by the source, set it to NULL
      and include its dotted path in missing_fields. Do not omit required keys.
    - Write only /workspace/answer.json. Do not include prose outside the file.

    Formulas for derived metrics: 
    - free_cash_flow = operating_cash_flow - capital_expenditures.
    - net_cash_or_debt = cash_and_equivalents - total_debt.
    - gross_margin = gross_profit / revenue.
    - operating_margin = operating_income / revenue.
    - net_margin = net_income / revenue.
    - free_cash_flow_margin = free_cash_flow / revenue.
    - free_cash_flow_conversion = free_cash_flow / net_income.
    - capex_intensity = capital_expenditures / revenue.
    - current_ratio = current_assets / current_liabilities.
    - debt_to_equity = total_debt / shareholders_equity.

